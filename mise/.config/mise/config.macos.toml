# All system packages. This file loads ONLY on macOS (via auto_env; see .miserc.toml),
# so Linux hosts get no brew/cask/mas packages at all -- matching how they work today.
# Homebrew is not required; mise pours bottles from ghcr and writes brew-compatible
# receipts. See brew/Brewfile for the residual set mise-brew cannot handle.
[bootstrap.packages]
# Formulae
"brew:asciinema" = "latest"
"brew:git" = "latest"
"brew:automake" = "latest"
"brew:bash" = "latest"
"brew:lima" = "latest"
"brew:curl" = "latest"
"brew:docker" = "latest"
"brew:findutils" = "latest"
"brew:gawk" = "latest"
"brew:gcc" = "latest"
"brew:git-absorb" = "latest"
"brew:git-branchless" = "latest"
"brew:git-lfs" = "latest"
"brew:gnu-sed" = "latest"
"brew:gnu-tar" = "latest"
"brew:gnutls" = "latest"
"brew:gnupg" = "latest"
"brew:graphviz" = "latest"
"brew:grep" = "latest"
"brew:psutils" = "latest"
"brew:grpcurl" = "latest"
"brew:gzip" = "latest"
"brew:htop" = "latest"
"brew:krew" = "latest"
"brew:kube-ps1" = "latest"
"brew:kubecolor" = "latest"
"brew:moreutils" = "latest"
"brew:mtr" = "latest"
"brew:ncdu" = "latest"
"brew:nmap" = "latest"
"brew:p7zip" = "latest"
"brew:patchutils" = "latest"
"brew:protobuf" = "latest"
"brew:pstree" = "latest"
"brew:pwgen" = "latest"
"brew:qemu" = "latest"
"brew:rename" = "latest"
"brew:retry" = "latest"
"brew:rsync" = "latest"
"brew:shfmt" = "latest"
"brew:sipcalc" = "latest"
"brew:skopeo" = "latest"
"brew:socat" = "latest"
"brew:stern" = "latest"
"brew:tcpdump" = "latest"
"brew:terminal-notifier" = "latest"  # used by the claude notify hooks
"brew:tmux" = "latest"
"brew:tree" = "latest"
"brew:watch" = "latest"
"brew:wget" = "latest"
"brew:yamllint" = "latest"
"brew:yq" = "latest"
"brew:zsh" = "latest"
"brew:mas" = "latest"

# Mac App Store (requires being signed into the App Store)
"mas:937984704" = "latest"  # Amphetamine
"mas:1475387142" = "latest"  # Tailscale

[bootstrap.macos.defaults."com.apple.finder"]
_FXShowPosixPathInTitle = true
ShowExternalHardDrivesOnDesktop = true
ShowMountedServersOnDesktop = true
ShowRemovableMediaOnDesktop = true
AppleShowAllFiles = true
ShowStatusBar = true
ShowPathbar = true
FXDefaultSearchScope = "SCcf"
FXPreferredViewStyle = "Nlsv"
FXRemoveOldTrashItems = true
FXEnableExtensionChangeWarning = false

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
AppleEnableSwipeNavigateWithScrolls = 1
"com.apple.trackpad.scaling" = 0.875
"com.apple.swipescrolldirection" = false
NSNavPanelExpandedStateForSaveMode = true
NSNavPanelExpandedStateForSaveMode2 = true
NSDocumentSaveNewDocumentsToCloud = false
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false

[bootstrap.macos.defaults."com.apple.LaunchServices"]
LSQuarantine = false

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
TrackpadFourFingerHorizSwipeGesture = 2

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.NetworkBrowser"]
BrowseAllInterfaces = true

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
largesize = 30
tilesize = 40
magnification = 1
mru-spaces = false
wvous-br-corner = 13

[bootstrap.macos.defaults."com.apple.spaces"]
spans-displays = false

# Imperative bits that don't fit `defaults write`, plus a killall to apply changes.
[bootstrap.hooks.post-defaults]
run = "bash ~/.dotfiles/macos-defaults-extras.sh"
