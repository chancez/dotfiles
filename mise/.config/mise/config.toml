"go:github.com/rhysd/actionlint/cmd/actionlint" = "latest"
"go:github.com/spf13/cobra-cli" = "latest"
"go:github.com/jstemmer/go-junit-report" = "latest"
"go:mvdan.cc/gofumpt" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:github.com/google/gops" = "latest"
"go:github.com/grpc-ecosystem/grpc-health-probe" = "latest"
"go:github.com/pradipta/wallfacer" = "latest"
yazi = "latest"

# Dotfiles: replaces GNU Stow (setup.sh). `symlink-each` mirrors `stow --no-folding`
# (real target dir, per-file symlinks) so apps can still write generated files into
# their config dir. Whole-file `symlink` is used for single-file dotfiles at $HOME.
# Sources are absolute ~/.dotfiles/... so they resolve identically on macOS and in the
# Ubuntu container (/home/chance/.dotfiles). Applied by `mise dotfiles apply` / bootstrap.
[dotfiles]
# App config directories
"~/.config/nvim"     = { source = "~/.dotfiles/neovim/.config/nvim",       mode = "symlink-each" }
"~/.config/kitty"    = { source = "~/.dotfiles/kitty/.config/kitty",       mode = "symlink-each" }
"~/.config/atuin"    = { source = "~/.dotfiles/atuin/.config/atuin",       mode = "symlink-each" }
"~/.config/zsh"      = { source = "~/.dotfiles/zsh/.config/zsh",           mode = "symlink-each" }
"~/.config/mcphub"   = { source = "~/.dotfiles/mcphub/.config/mcphub",     mode = "symlink-each" }
"~/.config/opencode" = { source = "~/.dotfiles/opencode/.config/opencode", mode = "symlink-each" }
"~/.config/.copilot" = { source = "~/.dotfiles/copilot/.config/.copilot",  mode = "symlink-each" }
"~/.config/mise"     = { source = "~/.dotfiles/mise/.config/mise",         mode = "symlink-each" }  # links config.toml/mise.lock; leaves conf.d/work.toml alone
"~/.config/cm"       = { source = "~/.dotfiles/cm/.config/cm",             mode = "symlink-each" }
"~/.git-template"    = { source = "~/.dotfiles/git/.git-template",         mode = "symlink-each" }
"~/.ssh"             = { source = "~/.dotfiles/ssh/.ssh",                   mode = "symlink-each" }  # links only config; leaves keys/known_hosts
"~/.lima"            = { source = "~/.dotfiles/lima/.lima",                 mode = "symlink-each" }
"~/.local/bin"       = { source = "~/.dotfiles/bins/.local/bin",           mode = "symlink-each" }

"~/.serena"             = { source = "~/.dotfiles/serena/.serena",            mode = "symlink-each" }
"~/.agents"             = { source = "~/.dotfiles/agents/.agents",            mode = "symlink-each" }
"~/.claude"             = { source = "~/.dotfiles/claude/.claude",            mode = "symlink-each" }
"~/.codex"              = { source = "~/.dotfiles/codex/.codex",              mode = "symlink-each" }
"~/.pi"                 = { source = "~/.dotfiles/pi/.pi",                    mode = "symlink-each" }

"~/.claude/skills/*"    = { source = "~/.dotfiles/agents/.agents/skills/*",   mode = "symlink" }  # Share skills
"~/.codex/skills/*"     = { source = "~/.dotfiles/agents/.agents/skills/*",   mode = "symlink" }  # Share skills without replacing unmanaged entries

# Agora skills linked to the local checkout
"~/.claude/skills/agora"    = { source = "~/projects/agora/skills/agora",     mode = "symlink" }
"~/.codex/skills/agora"     = { source = "~/projects/agora/skills/agora",     mode = "symlink" }
"~/.agents/skills/agora"    = { source = "~/projects/agora/skills/agora",     mode = "symlink" }

"~/.claude/CLAUDE.md"   = { source = "~/.dotfiles/agents/.agents/AGENTS.md",  mode = "symlink" } # Reuse AGENTS.md
"~/.codex/AGENTS.md"    = { source = "~/.dotfiles/agents/.agents/AGENTS.md",  mode = "symlink" } # Share AGENTS.md
"~/.pi/agent/AGENTS.md" = { source = "~/.dotfiles/agents/.agents/AGENTS.md",  mode = "symlink" } # Share AGENTS.md

# Single files at ~/.config/ root and $HOME
"~/.config/starship.toml"     = { source = "~/.dotfiles/starship/.config/starship.toml", mode = "symlink" }
"~/.agignore"                 = { source = "~/.dotfiles/ag/.agignore",                    mode = "symlink" }
"~/.bc"                       = { source = "~/.dotfiles/bc/.bc",                          mode = "symlink" }
"~/.btt_autoload_preset.json" = { source = "~/.dotfiles/bettertouchtool/.btt_autoload_preset.json", mode = "symlink" }
"~/.ctags"                    = { source = "~/.dotfiles/ctags/.ctags",                    mode = "symlink" }
"~/.digrc"                    = { source = "~/.dotfiles/dig/.digrc",                      mode = "symlink" }
"~/.fdignore"                 = { source = "~/.dotfiles/fd/.fdignore",                    mode = "symlink" }
"~/.gitconfig"                = { source = "~/.dotfiles/git/.gitconfig",                  mode = "symlink" }
"~/.gitignore"                = { source = "~/.dotfiles/git/.gitignore",                  mode = "symlink" }
"~/.pgclirc"                  = { source = "~/.dotfiles/postgres/.pgclirc",               mode = "symlink" }
"~/.psqlrc"                   = { source = "~/.dotfiles/postgres/.psqlrc",                mode = "symlink" }
"~/.rgignore"                 = { source = "~/.dotfiles/rg/.rgignore",                    mode = "symlink" }
"~/.ripgreprc"                = { source = "~/.dotfiles/rg/.ripgreprc",                   mode = "symlink" }
"~/.tmux.conf"                = { source = "~/.dotfiles/tmux/.tmux.conf",                 mode = "symlink" }
"~/.vimrc"                    = { source = "~/.dotfiles/vim/.vimrc",                      mode = "symlink" }
"~/.zshenv"                   = { source = "~/.dotfiles/zsh/.zshenv",                     mode = "symlink" }
# Also link .zshenv into $ZDOTDIR. Once ZDOTDIR is exported, zsh reads $ZDOTDIR/.zshenv and
# never looks at ~/.zshenv, so a nested or re-exec'd shell would skip it entirely and lose
# both the $PATH ordering and NO_GLOBAL_RCS. ~/.zshenv is still needed to bootstrap the very
# first shell, which is what sets ZDOTDIR in the first place.
"~/.config/zsh/.zshenv"       = { source = "~/.dotfiles/zsh/.zshenv",                     mode = "symlink" }
"~/.inputrc"                  = { source = "~/.dotfiles/zsh/.inputrc",                    mode = "symlink" }

# Shell activation is intentionally omitted: shims are on $PATH via zsh/.config/zsh/paths.zsh
# (mise activate breaks kitten ssh). Disable every target explicitly so a future default can't
# start writing into rc files.
[bootstrap.mise_shell_activate]
zprofile     = false
zshrc        = false
bashrc       = false
bash_profile = false
fish         = false
