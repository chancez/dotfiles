legacy_version_file = false
# prefer_offline = true

[settings.github]
oauth_client_id = "Ov23liqk9UEjOiEaCBWq"
oauth_export_env = ""

[tools]
go = ["latest", "1.25", "1.24"]
java = "26"
node = ['lts', '20', '19', '18', '17', '16']
python = [
  { version='3', postinstall = "python -m pip install --upgrade pynvim esbonio" },
  '2.7'
]
# mise's rust is a self-contained rustup install, and a bare toolchain carries neither the
# rust-analyzer binary nor the std sources it reads, so `rust-analyzer` resolves to a proxy that
# errors. Adding the components here rather than by hand means a reinstall restores them.
rust = { version = "stable", components = ["rust-analyzer", "rust-src"] }

usage = "latest"
# Prompt
starship = "latest"
# History
atuin = "18.16.1"

kubectl = "latest"
helm = "prefix:3"
"aqua:danielfoehrKn/kubeswitch" = "latest"
