# Spaces shown in the kspaces sidebar, in display order.
spaces = [
  "~/projects/work/hubble-timescape",
  "~/projects/gr",
  "~/projects/work/isovalent-operator",
  "~/projects/work/docs-hypershield",
  "~/projects/work/docs-reference",
  "~/projects/kitty",
  "~/projects/cm",
  "~/projects/kspaces",
  "~/.dotfiles",
]

# Open every window kspaces opens through cm, like cmd+t does: a worktree's first tab, and
# the tabs and splits commands run in. kspaces appends where it opens, --cwd and
# --add-to-session, and the command.
launch = ["kitten", "cm_launch.py"]

# Saved sessions (save_sessions.py), restored when a worktree with no windows is opened.
sessions = "~/.local/share/kitty/sessions"

# The new worktree form starts branch names with pr/chancez/.
[worktrees]
dir = ".worktrees"
branch_prefix = "pr/chancez"

[sidebar]
width = 30

# kspaces kitty install's files, included from kitty.conf: rewrite them when another
# kspaces is installed, and install the session saver.
[kitty]
auto_install = true
save_sessions = true
