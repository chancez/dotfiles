groups = ["work", "tools"]

spaces = [
  { path = "~/projects/gr", group = "tools" },
  { path = "~/projects/cm", group = "tools" },
  { path = "~/projects/kspaces", group = "tools" },
  { path = "~/projects/kitty", group = "tools" },

  "~/.dotfiles",
]

# Open every window kspaces opens through cm, like cmd+t does: a worktree's first tab, and
# the tabs and splits commands run in. kspaces appends where it opens, --cwd and
# --add-to-session, and the command.
launch = ["kitten", "cm_launch.py"]

# Saved sessions (save_sessions.py), restored when a worktree with no windows is opened.
sessions = "~/.local/share/kitty/sessions"

# The layout the new worktree form's Pull request tab starts on.
pr_layout = "claude PR review"

# The new worktree form starts branch names with pr/chancez/; removing a worktree starts with deleting
# its branch ticked when that loses nothing.
[worktrees]
dir = ".worktrees"
branch_prefix = "pr/chancez"
delete_branch = true

[sidebar]
width = 35
popup = "panel"

# kspaces kitty install's files, included from kitty.conf: rewrite them when another
# kspaces is installed, and install the session saver.
[kitty]
auto_install = true
save_sessions = true

[[commands]]
name = "claude"
run = ["claude", "{prompt?}"]
inputs = [{ name = "prompt", label = "Prompt" }]

[[commands]]
name = "omp"
run = ["omp", "{prompt}"]
inputs = [{ name = "prompt", label = "Prompt" }]

[[commands]]
name = "gr"
run = ["gr"]
open = "split"

[[layouts]]
name = "claude + gr review"

[[layouts.tabs]]
panes = [
  { command = "claude" },
  { command = "gr", split = "right", size = 42 },
  { split = "below", of = 1, size = 24 },
]

[[layouts]]
name = "omp + gr review"
[[layouts.tabs]]
panes = [
  { command = "omp" },
  { command = "gr", split = "right", size = 42 },
  { split = "below", of = 1, size = 24 },
]
# Claude reviewing the PR, its prompt filled in with the PR's number, to edit or keep.
[[layouts]]
name = "claude PR review"
[[layouts.tabs]]
panes = [
  { command = "claude", inputs = { prompt = "/review medium #{pr}" } },
]
