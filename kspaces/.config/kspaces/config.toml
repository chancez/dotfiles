groups = ["work", "tools"]

spaces = [
  "~/.dotfiles",
  { path = "~/projects/gr", group = "tools" },
  { path = "~/projects/cm", group = "tools" },
  { path = "~/projects/kspaces", group = "tools" },
  { path = "~/projects/kitty", group = "tools" },
]

# Saved sessions (save_sessions.py), restored when a worktree with no windows is opened.
sessions = "~/.local/share/kitty/sessions"

# The session provider: Close and Suspend keep each window's cm session (cm shelve), so reopening the
# session restores them, and the sidebar lists and acts on the cm sessions no window shows. Needs a kspaces
# with session providers, which reads this key; an older one knows only keeper.
provider = ["kspaces-provider-cm"]

# The layouts the new worktree form's Pull request and Issue tabs start on.
pr_layout = "claude PR review"
issue_layout = "claude implement issue"

# The new worktree form starts branch names with pr/chancez/; removing a worktree starts with deleting
# its branch ticked when that loses nothing.
[worktrees]
dir = ".worktrees"
branch_prefix = "pr/chancez"
delete_branch = true

[sidebar]
width = 35
popup = "panel"

# kspaces kitty install's files, included from kitty.conf: rewrite them when another
# kspaces is installed, and install the session saver.
[kitty]
auto_install = true
save_sessions = true

[editor]
vim = true

[[commands]]
name = "claude"
run = ["claude", "{prompt?}"]
inputs = [{ name = "prompt", label = "Prompt" }]

[[commands]]
name = "omp"
run = ["omp", "{prompt?}"]
inputs = [{ name = "prompt", label = "Prompt" }]

[[commands]]
name = "gr"
run = ["gr"]
open = "split"

[[layouts]]
name = "claude + gr review"

[[layouts.tabs]]
panes = [
  { command = "claude" },
  { command = "gr", split = "right", size = 42 },
  { split = "below", of = 1, size = 24 },
]

[[layouts]]
name = "omp + gr review"
[[layouts.tabs]]
panes = [
  { command = "omp" },
  { command = "gr", split = "right", size = 42 },
  { split = "below", of = 1, size = 24 },
]
# Claude reviewing the PR, its prompt filled in with the PR's number, to edit or keep.
[[layouts]]
name = "claude PR review"
[[layouts.tabs]]
panes = [
  { command = "claude", inputs = { prompt = "/review medium #{pr}" } },
]

# Claude implementing the issue, its prompt filled in with the issue's number, to edit or keep, with gr
# beside it to review the changes and a shell below.
[[layouts]]
name = "claude implement issue"
[[layouts.tabs]]
panes = [
  { command = "claude", inputs = { prompt = "Implement issue #{issue}" } },
  { command = "gr", split = "right", size = 42 },
  { split = "below", of = 1, size = 24 },
]
