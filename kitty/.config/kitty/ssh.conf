# Configuration for `kitten ssh`.
#
# Only exists to undo, for remote hosts, one consequence of `shell_integration disabled` in kitty.conf.
#
# That setting is right locally and wrong remotely. Locally kitty's injection rewrites ZDOTDIR for the
# process it spawns, which for these windows is `cm attach` rather than a shell, so the injection never
# reaches the shell that ends up on screen; zsh/kitty.zsh loads the integration by hand instead. But
# ssh.conf's shell_integration defaults to `inherited`, so `disabled` followed the kitten to every host and
# it shipped nothing. The hand-load cannot cover that: it is gated on KITTY_INSTALLATION_DIR, which on a
# remote host nothing sets, since the only thing that would have set it is the bootstrap that was disabled.
#
# What that cost, and why it is worth a file of its own: cm reads OSC 7 and OSC 133 out of what the
# integration emits. Without them on the far side of an ssh, cm believes a session is still in the local
# directory it started in, so `cm list` reports the wrong place, a new split opens there rather than on the
# remote host, and cm cannot tell whether a remote command is running. Measured on white: cwd_is_local
# stayed true and cwd_uri kept naming this machine while the shell was on another one.
#
# no-title to match kitty.conf, and for the same reason: zsh/title.zsh sets the title itself, and it runs
# on the remote too since these dotfiles are installed there. Two writers would fight over it.
shell_integration enabled no-title

# Land in the directory the session being split was in, when the launcher knows it.
#
# KITTY_LOGIN_CWD rather than this file's own `cwd` option, and copied from the local environment rather
# than written here, because that is the variable the far side actually reads. From the shipped bootstrap:
#
#   bootstrap.sh:126        login_cwd="$KITTY_LOGIN_CWD"
#   bootstrap.py:310        cwd = os.environ.pop('KITTY_LOGIN_CWD', '')
#   bootstrap-utils.sh:219  [ -n "$login_cwd" ] && cd "$login_cwd"
#
# `cwd ${KITTY_SSH_CWD}` was tried first and did nothing: the launcher set the variable on the kitten
# correctly, verified in its log, so either the option is not expanded against the kitten's own environment
# or the two mechanisms collided. Handing the bootstrap the name it consumes removes the question.
#
# cm_launch.py sets it for that one kitten invocation only, with `env`. Set per process rather than in the
# session's environment on purpose: a value left in the shell would silently apply to the next `kitten ssh`
# typed by hand in the same window and send it to a path belonging to a different host.
#
# Unset locally is the ordinary case, and empty means no directory change, per the `-n` test above. The
# remote shell never sees it either way, since the bootstrap pops it.
env KITTY_LOGIN_CWD=_kitty_copy_env_var_
