# cm configuration. See https://github.com/chancez/cm/blob/main/docs/config.md

log_level = "debug"

# [debug]
# # Enable pprof server for profiling. Off by default.
# pprof = true
# flight_recorder = true
# flight_recorder_window = "10s"
rebind_replaces = true

[server]
# Start the server through launchd on macOS, so a Force Quit of the terminal app cannot end sessions.
launchd = true

[persist]
# Let session content survive a reboot. Off by default.
enabled = true
sessions = ["*"]
on_restore = "command"
safe_commands = ["nvim", "less", "htop", "vim", "gr", "claude", "omp"]

[keys.session]
detach = ["ctrl-\\"]
prefix = ["ctrl-]"]

[scrollback]
lines = 10000
pager = "nvim --cmd 'let g:auto_session_enabled = v:false' -c 'setlocal nonumber nolist showtabline=0 foldcolumn=0|Man!' -c \"autocmd VimEnter * normal G\" -"

# A closed window ends its session, busy or idle; the detach key is how one is kept running.
[close]
idle = "kill"
busy = "kill"

[remote.hosts.white]
[remote.hosts.dune]
