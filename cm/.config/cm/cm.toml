# cm configuration. See https://github.com/chancez/cm/blob/main/docs/config.md

log_level = "debug"

[debug]
# Enable pprof server for profiling. Off by default.
pprof = true
flight_recorder = true
flight_recorder_window = "10s"

[persist]
# Let session content survive a reboot. Off by default.
enabled = true
sessions = ["*"]
on_restore = "command"
safe_commands = ["nvim", "less", "htop", "vim", "gr"]

[keys.session]
detach = ["ctrl-\\"]
prefix = ["ctrl-]"]

[scrollback]
lines = 10000
pager = "nvim --cmd 'let g:auto_session_enabled = v:false' -c 'setlocal nonumber nolist showtabline=0 foldcolumn=0|Man!' -c \"autocmd VimEnter * normal G\" -"
